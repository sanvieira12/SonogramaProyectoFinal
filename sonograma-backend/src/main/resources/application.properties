# Server config
server.port=8080
server.servlet.context-path=/api

# Active profile — Railway sobreescribe con SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sonograma_db

spring.datasource.username=sonograma_user
spring.datasource.password=sonograma_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (secret debe tener minimo 32 caracteres para HS256)
jwt.secret=SonogramaJWTSecretKeyDesarrollo2026!
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.sonograma=DEBUG
logging.level.com.sonograma.security=DEBUG

spring.application.name=sonograma-backend

# Configuración comercial inicial. En una versión futura puede migrarse a tabla editable.
sonograma.frontend.base-url=${SONOGRAMA_FRONTEND_BASE_URL:http://localhost:5173}
# Orígenes locales por defecto para desarrollo. Producción los reemplaza en application-prod.properties.
sonograma.cors.allowed-origins=${SONOGRAMA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
sonograma.google.admin-email=${SONOGRAMA_GOOGLE_ADMIN_EMAIL:sonograma.tiendadediscos@gmail.com}
sonograma.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
sonograma.google.handoff-ttl-seconds=60
sonograma.ventas.impuesto-porcentaje=${SONOGRAMA_VENTAS_IMPUESTO_PORCENTAJE:0}
sonograma.ventas.otros-costos=${SONOGRAMA_VENTAS_OTROS_COSTOS:0}

# CRM recommendation weights (deterministic and explainable).
sonograma.crm.recommendation.historical-weight=0.40
sonograma.crm.recommendation.recent-weight=0.60
sonograma.crm.recommendation.manual-interest-weight=30
sonograma.crm.recommendation.artist-weight=25
sonograma.crm.recommendation.label-weight=15
sonograma.crm.recommendation.genre-weight=12
sonograma.crm.recommendation.style-weight=12
sonograma.crm.recommendation.period-weight=10
sonograma.crm.recommendation.price-weight=8
sonograma.crm.recommendation.format-weight=5
sonograma.crm.recommendation.condition-weight=3
sonograma.crm.recommendation.high-affinity-threshold=50
sonograma.crm.recommendation.medium-affinity-threshold=25
sonograma.crm.recommendation.default-limit=20
sonograma.crm.recommendation.maximum-limit=100

# VinylFuture scraping config
sonograma.vinylfuture.delay-ms=400
sonograma.vinylfuture.timeout-ms=10000
sonograma.vinylfuture.media-directory=${VINYLFUTURE_MEDIA_DIRECTORY:./data/vinylfuture-media}

# Discogs API — token optional. Use rate-aware single-worker requests.
discogs.api.token=${DISCOGS_TOKEN:}
discogs.api.request-delay-ms=${DISCOGS_REQUEST_DELAY_MS:1200}
discogs.api.max-retries=${DISCOGS_MAX_RETRIES:3}
discogs.covers.directory=${DISCOGS_COVERS_DIRECTORY:./data/discogs-covers}

# Actuator (healthcheck para Railway)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
